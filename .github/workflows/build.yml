name: Build

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and check (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      # Build on every supported JDK so a break on one version does not hide the others.
      fail-fast: false
      matrix:
        # The artifacts target Java 1.8 (the minimum); newer JDKs are verified for compatibility.
        java: [ '8', '11', '17', '21' ]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, check and test
        # package runs the full quality gate: checkstyle (validate), compile, tests,
        # spotbugs and the source/javadoc jars. gpg signing is skipped (no keys in CI).
        run: mvn -B -ntp clean package -Dgpg.skip=true
