name: Integration

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]
  workflow_dispatch:

jobs:
  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        # -Pintegration runs the *IT tests via Testcontainers against a real Dameng database.
        # GitHub-hosted runners provide a Docker daemon Testcontainers can use.
        run: mvn -B -ntp -Pintegration verify -Dgpg.skip=true
